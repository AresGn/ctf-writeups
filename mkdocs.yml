site_name: RACE CONDITION — CTF write-ups
site_description: CTF write-ups by team RACE CONDITION (AresGn & Nyx)
docs_dir: docs
hooks:
  - hooks/strip_lang_switch.py
theme:
  name: material
  palette:
    scheme: slate
    primary: black
    accent: green
  features:
    - navigation.sections
    - navigation.indexes
    - search.suggest
    - content.code.copy
plugins:
  - search
  - tags
  - i18n:
      docs_structure: suffix
      languages:
        - locale: en
          name: English
          default: true
          build: true
        - locale: fr
          name: Français
          build: true
markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true
exclude_docs: |
  **/files/
  **/notes.md
  **/.gitkeep
  2026-chronos-csctf/web/switchboard/
  2026-chronos-csctf/web/two-key-turn/
